[project]
name = "workflow-executor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "matricarin", email = "matricarin@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
workflow-executor = "workflow_executor:main"

[project.optional-dependencies]

dev = [
    "pytest>=8.3.3",
    "pytest-cov>=5.0.0",
    "mypy>=1.11.2",
    "ruff>=0.6.9"
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.3",
    "pytest-cov>=5.0.0",
    "mypy>=1.11.2",
    "ruff>=0.6.9"
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath=["."]
testpaths=["tests"]
addopts=["--import-mode=importlib"]

